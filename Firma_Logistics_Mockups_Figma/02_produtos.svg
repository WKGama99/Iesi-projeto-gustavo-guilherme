al 1,5L</text><text x="690" y="500" class="body" text-anchor="start">Bebidas</text><text x="850" y="500" class="body" text-anchor="start">1,55 kg</text><text x="940" y="500" class="body" text-anchor="start">30×9×9 cm</text><text x="1125" y="500" class="body" text-anchor="start">840</text><text x="1240" y="500" class="small" text-anchor="start">Disponível</text><rect x="1230" y="480" width="112" height="29" rx="14" fill="#e6f6ef"/><text x="1286" y="500" class="small" text-anchor="middle">Disponível</text><text x="1370" y="500" class="h2" text-anchor="middle">⋯</text><line x1="340" y1="528" x2="1385" y2="528" stroke="#edf1f6"/><text x="342" y="574" class="body" text-anchor="start">PRD-002</text><text x="465" y="574" class="body" text-anchor="start">Caixa de cereais</text><text x="690" y="574" class="body" text-anchor="start">Mercearia</text><text x="850" y="574" class="body" text-anchor="start">0,75 kg</text><text x="940" y="574" class="body" text-anchor="start">32×22×8 cm</text><text x="1125" y="574" class="body" text-anchor="start">320</text><text x="1240" y="574" class="small" text-anchor="start">Disponível</text><rect x="1230" y="554" width="112" height="29" rx="14" fill="#e6f6ef"/><text x="1286" y="574" class="small" text-anchor="middle">Disponível</text><text x="1370" y="574" class="h2" text-anchor="middle">⋯</text><line x1="340" y1="602" x2="1385" y2="602" stroke="#edf1f6"/><text x="342" y="648" class="body" text-anchor="start">PRD-003</text><text x="465" y="648" class="body" text-anchor="start">Detergente 2L</text><text x="690" y="648" class="body" text-anchor="start">Limpeza</text><text x="850" y="648" class="body" text-anchor="start">2,10 kg</text><text x="940" y="648" class="body" text-anchor="start">28×14×12 cm</text><text x="1125" y="648" class="body" text-anchor="start">145</text><text x="1240" y="648" class="small" text-anchor="start">Disponível</text><rect x="1230" y="628" width="112" height="29" rx="14" fill="#e6f6ef"/><text x="1286" y="648" class="sm